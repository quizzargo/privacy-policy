<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: #f9fafb;
    color: #111827;
    max-width: 600px;
    margin: 80px auto;
    padding: 0 24px;
    line-height: 1.6;
  }
  
  header {
    text-align: center;
    margin-bottom: 48px;
  }

  .logo-placeholder {
    width: 64px;
    height: 64px;
    background: #2563eb;
    border-radius: 16px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 600;
    font-size: 24px;
    box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
  }

  h1 {
    font-size: 2em;
    font-weight: 600;
    margin: 0 0 8px 0;
  }

  p.subtitle {
    color: #6b7280;
    margin: 0;
    font-size: 1.05em;
  }

  .nav-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    display: flex;
    flex-direction: column;
    padding: 24px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s ease;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }

  .card:hover {
    border-color: #2563eb;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    transform: translateY(-2px);
  }

  .card h2 {
    font-size: 1.25em;
    font-weight: 600;
    margin: 0 0 4px 0;
    color: #111827;
  }

  .card p {
    margin: 0;
    color: #6b7280;
    font-size: 0.95em;
  }

  footer {
    text-align: center;
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid #e5e7eb;
    color: #9ca3af;
    font-size: 0.85em;
  }

  footer a {
    color: #6b7280;
    text-decoration: none;
    font-weight: 500;
  }

  footer a:hover {
    text-decoration: underline;
    color: #111827;
  }
</style>
</head>
<body>
  <header>
    <!-- You can replace the text inside this div with an <img src="your-logo.png"> later -->

  <footer>
