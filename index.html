<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizzar Go - Legal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { 
    font-family: 'Lexend', -apple-system, Segoe UI, Roboto, sans-serif; 
    background-color: #f8f9fa; 
    margin: 0; 
    padding: 40px 20px; 
    color: #1a1a1a; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 80vh;
  }
  .container {
    background: #ffffff;
    max-width: 440px;
    width: 100%;
    padding: 48px 40px;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    text-align: center;
    border: 1px solid #f1f3f5;
  }
  h1 { 
    font-size: 1.75em; 
    font-weight: 600;
    margin-top: 0;
    margin-bottom: 8px; 
  }
  p.subtitle {
    color: #6c757d;
    font-size: 0.95em;
    margin-bottom: 32px;
  }
  .links { 
    display: flex; 
    flex-direction: column; 
    gap: 16px; 
  }
  a.card-link { 
    display: block;
    padding: 18px 24px;
    background-color: #ffffff;
    color: #1a1a1a;
    text-decoration: none;
    font-size: 1.05em;
    font-weight: 500;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    transition: all 0.2s ease;
  }
  a.card-link:hover { 
    border-color: #2563eb;
    background-color: #f8fafc;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
  }
  .footer {
    margin-top: 40px;
    font-size: 0.85em;
    color: #adb5bd;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Quizzar Go</h1>
    <p class="subtitle">Legal Information &amp; Policies</p>
    
    <div class="links">
      <a href="privacy-policy.html" class="card-link">Privacy Policy</a>
      <a href="terms.html" class="card-link">Terms &amp; Conditions</a>
    </div>

    <div class="footer">
      &copy; 2026 Quizzar Go. All rights reserved.
    </div>
  </div>
</body>
</html>
